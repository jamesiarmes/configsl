plugins:
  - rubocop-factory_bot
  - rubocop-md
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: true
  TargetRubyVersion: 3.3
  Exclude:
    - 'out/**/*'
    - 'vendor/**/*'

Layout/InitialIndentation:
  Exclude:
    - '**/*.md'

Metrics/MethodLength:
  CountAsOne:
    - array
    - method_call
    - hash

RSpec/ExampleLength:
  CountAsOne:
    - array
    - hash

# Prefer greater nesting depth for better organization.
RSpec/NestedGroups:
  Max: 6

RSpec/SpecFilePathFormat:
  CustomTransform:
    ConfigSL: configsl

Style/OneClassPerFile:
  Exclude:
    - '**/*.md'
