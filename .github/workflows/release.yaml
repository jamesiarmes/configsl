name: Release Gem

on:
  push:
    tags:
        - '**'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release new version of ConfigSL
    runs-on: ubuntu-latest
    steps:
      - run: echo "Releasing configsl-${{ github.ref_name }}"
      - uses: actions/checkout@v7
      - name: Set up Ruby
        # v1.316.0
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9
        with:
          bundler-cache: true
      - name: Push to rubygems
        # v1.4.0
        uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092
