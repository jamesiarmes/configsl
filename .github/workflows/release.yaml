name: Release Gem

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release new version of ConfigSL
    runs-on: ubuntu-latest
    steps:
      - run: echo "Releasing configsl-${{ github.event.inputs.tag || github.ref_name }}"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Set up Ruby
        # v1.316.0
        uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b
      - name: Configure RubyGems Credentials
        # v2.1.0
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a
      - name: Build and Push Gem
        run: |
          gem build configsql.gemspec -o configsl.gem
          gem push configsl.gem
